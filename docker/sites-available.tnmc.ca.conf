<VirtualHost *:80>
  ServerAdmin alex@varju.ca
  ServerName tnmc.ca
  ServerAlias www.tnmc.ca m.tnmc.ca

  DocumentRoot /tnmc
  <Directory />
    Options FollowSymLinks
    AllowOverride None
  </Directory>
  <Directory /tnmc/>
    AllowOverride FileInfo AuthConfig
    Options FollowSymLinks ExecCGI
    Require all granted
  </Directory>

  LogLevel warn
  ErrorLog /dev/stderr
  CustomLog /dev/stdout combined

  AddHandler cgi-script .cgi

  # Only .cgi pages and static assets are public
  <FilesMatch "\.(pm|pl|sh|txt|md|log|conf|yaml|yml)$|^(Makefile|Dockerfile)$">
    Require all denied
  </FilesMatch>
  <Files "robots.txt">
    Require all granted
  </Files>
  <LocationMatch "/\.">
    Require all denied
  </LocationMatch>

  # cron scripts and import tools run through docker exec, never over HTTP
  <Location "/movies/cron/">
    Require all denied
  </Location>
  <Location "/pics/tools/">
    Require all denied
  </Location>
</VirtualHost>
